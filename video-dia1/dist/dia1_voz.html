    const ang=-Math.PI/2+(rnd(i)-.5)*2.6, sp=260+320*rnd(i+99);
    const x=420+Math.cos(ang)*sp*ct, y=200+Math.sin(ang)*sp*ct+520*ct*ct;
    const op=clamp(1-(ct-1.4)/1.0), sz=12+14*rnd(i+7), rot=ct*(200+400*rnd(i+3));
    if(op>0) cf+=`<rect x="${(-sz/2).toFixed(1)}" y="${(-sz/4).toFixed(1)}" width="${sz.toFixed(1)}" height="${(sz/2).toFixed(1)}" fill="${CONF[i%4]}" opacity="${op.toFixed(2)}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(0)})"/>`;
  }}
  $('confetti').innerHTML=cf;
}
const ICONS=[icon0,icon1,icon2,icon3];
const icG=[0,1,2,3].map(i=>$('ic'+i));

// ---- presenter
const MOODS=[{by:-8,br:0,sm:.35},{by:-1,br:12,sm:-.3},{by:5,br:-9,sm:-.05},{by:-6,br:0,sm:.85},{by:-6,br:0,sm:1}];
const MOUTH=C.mouth||[];
const env=t=>{const f=t*FPS,i=Math.floor(f),a=MOUTH[i]||0,b=MOUTH[i+1]||0;return a+(b-a)*(f-i);};
function presenter(t,pi,lt,k){
  const mc=MOODS[pi], mp=MOODS[Math.max(0,pi-1)], mk=pi===0?1:eio(lt/.8);
  const by=lerp(mp.by,mc.by,mk), br=lerp(mp.br,mc.br,mk), sm=lerp(mp.sm,mc.sm,mk), o=env(t);
  $('pres').style.opacity=eo(t/.6).toFixed(3);
  $('pres').style.transform=`translateY(${(420*k).toFixed(1)}px) scale(${(1-.25*k).toFixed(3)})`;
  $('pcard').setAttribute('fill',mix('#1A2030','#E9DFC6',k));
  $('torso').setAttribute('transform',`translate(0 600) scale(1 ${(1+.008*Math.sin(t*1.6)).toFixed(4)}) translate(0 -600)`);
  const rot=1.8*Math.sin(t*.85)+Math.sin(t*2.3+1), bob=-3*o+1.5*Math.sin(t*1.7);
  $('head').setAttribute('transform',`translate(0 ${bob.toFixed(2)}) rotate(${rot.toFixed(2)} 300 440)`);
  const bk=Math.floor(t/3.2), tb=bk*3.2+1+2*rnd(bk), d=Math.abs(t-tb), blink=d<.09?1-d/.09:0;
  const sq=`scale(1 ${(1-.92*blink).toFixed(3)})`;
  $('eyeL').setAttribute('transform',`translate(255 255) ${sq} translate(-255 -255)`);
  $('eyeR').setAttribute('transform',`translate(345 255) ${sq} translate(-345 -255)`);
  const dx=3*Math.sin(t*.7), dy=1.5*Math.sin(t*.5+1);
  $('pupL').setAttribute('transform',`translate(${dx.toFixed(2)} ${dy.toFixed(2)})`);
  $('pupR').setAttribute('transform',`translate(${dx.toFixed(2)} ${dy.toFixed(2)})`);
  const bY=206+by-o*3;
  $('browL').setAttribute('transform',`translate(255 ${bY.toFixed(1)}) rotate(${(-br).toFixed(1)})`);
  $('browR').setAttribute('transform',`translate(345 ${bY.toFixed(1)}) rotate(${br.toFixed(1)})`);
  // boca
  const hw=32+8*o+6*Math.max(0,sm), cy=-9*sm, up=9*sm-3*o, lo=9*sm+8+62*o;
  const dd=`M${-hw} ${cy} Q0 ${up} ${hw} ${cy} Q0 ${lo} ${-hw} ${cy} Z`;
  $('mfill').setAttribute('d',dd); $('mclipP').setAttribute('d',dd); $('mline').setAttribute('d',dd);
  const yt=(cy+up)/2, ym=(cy+lo)/2;
  $('teeth').setAttribute('x',-hw); $('teeth').setAttribute('width',2*hw); $('teeth').setAttribute('y',(yt-30).toFixed(1)); $('teeth').setAttribute('height',(42*(o>.1?1:0)).toFixed(1));
  $('tongue').setAttribute('cx',0); $('tongue').setAttribute('cy',(ym-2).toFixed(1));
}

// ---- frame renderer
let lastKey=null;
window.renderAt=function(t){
  let pi=-1;
  for(let i=0;i<P.length;i++) if(t>=starts[i]&&t<starts[i]+P[i].dur) pi=i;
  const inFinal=pi<0;
  $('stage').style.display=inFinal?'none':'block';
  $('prog').style.display=inFinal?'none':'flex';
  $('final').style.display=inFinal?'flex':'none';
  if(inFinal){
    lastKey=null;
    const ft=t-finalStart;
    const k=eio(ft/1.2); presenter(t,P.length,ft,k);
    document.body.style.background=mix(DARK,LIGHT,k);
    const delays=C.finalDelays||[1.0,2.0,3.4];
    C.final.forEach((l,i)=>{
      const a=eo((ft-delays[i])/.6), e=$('f'+i);
      e.style.opacity=a.toFixed(3); e.style.transform=`translateY(${((1-a)*36).toFixed(1)}px)`;
      e.querySelectorAll('.mk').forEach(m=>{m.style.backgroundSize=(100*eio((ft-delays[i]-.35)/.6)).toFixed(1)+'% 100%';});
    });
    return;
  }
  document.body.style.background=DARK;
  const p=P[pi], lt=t-starts[pi], dur=p.dur; presenter(t,pi,lt,0);
  progFill.forEach((el,j)=>{el.style.width=(100*(j<pi?1:j===pi?lt/dur:0)).toFixed(1)+'%';});
  const aIn=eio(lt/.5), aOut=eio((dur-lt)/.5);
  const st=$('stage'); st.style.opacity=(aIn*aOut).toFixed(3);
  st.style.transform=`translateY(${((1-aIn)*24-(1-aOut)*24).toFixed(1)}px)`;
  if($('tagText').textContent!==p.name) $('tagText').textContent=p.name;
  icG.forEach((g,j)=>{g.style.display=j===pi?'inline':'none';});
  ICONS[pi](lt,dur,t);
  let idx=-1; for(let k=0;k<p.bounds.length;k++) if(lt>=p.bounds[k]) idx=k;
  const sub=$('subIn');
  if(idx<0){ if(sub.innerHTML!=='') sub.innerHTML=''; lastKey=null; }
  else {
    const key=pi+'-'+idx; if(key!==lastKey){sub.innerHTML=html(p.chunks[idx]);lastKey=key;}
    const a=eo((lt-p.bounds[idx])/.22);
    sub.style.opacity=a.toFixed(3); sub.style.transform=`translateY(${((1-a)*22).toFixed(1)}px)`;
  }
};
if(location.hash==='#play'){const t0=performance.now();(function loop(){window.renderAt(((performance.now()-t0)/1000)%total);requestAnimationFrame(loop);})();}
else window.renderAt(0.0);
})();
</script>
